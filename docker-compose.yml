version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsops-postgres
    restart: always
    environment:
      POSTGRES_USER: pulsops
      POSTGRES_PASSWORD: pulsops_secret_password
      POSTGRES_DB: pulsops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsops -d pulsops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsops-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://pulsops:pulsops_secret_password@postgres:5432/pulsops_db?schema=public
      JWT_ACCESS_SECRET: pulsops_super_secret_access_jwt_key_2026
      JWT_REFRESH_SECRET: pulsops_super_secret_refresh_jwt_key_2026
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
